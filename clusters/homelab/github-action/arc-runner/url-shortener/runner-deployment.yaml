apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: homelab-runner
  namespace: arc-runners
spec:
  replicas: 1
  template:
    spec:
      repository: DrdmRandom/linker-url-shorterner 
      serviceAccountName: arc-runner-sa
      labels:
        - homelab
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "4"
          memory: "6Gi"
