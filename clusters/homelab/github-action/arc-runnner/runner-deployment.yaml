apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: homelab-runner
  namespace: arc-runners
spec:
  replicas: 1
  template:
    spec:
      repository: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      serviceAccountName: arc-runner-sa
      labels:
        - homelab
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "2000m"
          memory: "2Gi"
