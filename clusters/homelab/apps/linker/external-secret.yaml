  apiVersion: external-secrets.io/v1beta1
  kind: ExternalSecret
  metadata:
    name: registry-credentials
    namespace: linker
  spec:
    refreshInterval: 1h
    secretStoreRef:
      name: vault-backend
      kind: SecretStore
    target:
      name: registry-credentials
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "api-registry.cihuyproject.my.id": {
                  "username": "{{ .username }}",
                  "password": "{{ .password }}",
                  "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
                }
              }
            }
    dataFrom:
      - extract:
          key: docker-registry
