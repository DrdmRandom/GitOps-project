apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: google-oauth-credentials
  namespace: linker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: google-oauth-credentials
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: google-oauth
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: google-oauth
        property: clientSecret
